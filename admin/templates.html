<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template PDFs | Admin | IVÓRI Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="admin.css" />
    <style>
      .template-row {
        display: grid;
        grid-template-columns: 140px 1fr auto;
        gap: 8px;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
      }
      .template-row:last-child { border-bottom: none; }
      .template-row .row-label { font-weight: 600; font-size: 0.875rem; }
      .template-row .row-status {
        grid-column: 2 / -1;
        font-size: 0.78rem;
        color: var(--text-muted);
        margin-top: -4px;
        min-height: 1em;
      }
      .row-status.loaded { color: #2e7d52; font-weight: 600; }
      .browse-label {
        display: inline-block;
        padding: 8px 16px;
        background: var(--primary);
        color: #fff;
        border-radius: 6px;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: opacity 0.15s;
      }
      .browse-label:hover { opacity: 0.85; }
      @media (max-width: 580px) {
        .template-row { grid-template-columns: 1fr auto; }
        .template-row .row-label { grid-column: 1 / -1; font-size: 0.8rem; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="../index.html" class="logo" aria-label="IVÓRI Studio home">
          <span class="logo-mark">W</span>
          <span>IVÓRI</span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="../index.html">Home</a>
          <a href="../templates/index.html">Templates</a>
          <a href="../customer-sites.html">Client work</a>
          <a href="index.html">Admin</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="admin-wrap">
        <a href="index.html" class="admin-back">&larr; Admin home</a>
        <h1 style="margin-bottom: 28px;">Template PDFs</h1>

        <div class="admin-card" id="connect-card">
          <h2>One-time setup</h2>
          <p class="card-desc">
            Grant access to your project folder once. After that, uploading a PDF saves automatically with no extra steps.
          </p>
          <div class="action-bar">
            <button class="btn btn-primary" onclick="connectFolder()">Connect project folder</button>
            <span id="connect-status" class="save-status"></span>
          </div>
        </div>

        <div class="admin-card">
          <h2>Template PDFs</h2>
          <p class="card-desc">
            Pick a PDF for any template. It saves to the site automatically.
          </p>
          <div id="template-rows"></div>
          <div class="action-bar" id="fallback-bar" style="display:none;">
            <button class="btn btn-secondary" onclick="copyToClipboard()">Copy to clipboard (fallback)</button>
            <span id="status" class="save-status"></span>
          </div>
        </div>
      </div>
    </main>

    <script src="../data/template-data.js"></script>
    <script>
      var TEMPLATES = [
        { id: 'restaurant',       label: 'Restaurant' },
        { id: 'pharmacy',         label: 'Pharmacy' },
        { id: 'real-estate',      label: 'Real Estate' },
        { id: 'beauty-salon',     label: 'Beauty Salon' },
        { id: 'medical-clinic',   label: 'Medical Clinic' },
        { id: 'fitness-gym',      label: 'Fitness & Gym' },
        { id: 'law-firm',         label: 'Law Firm' },
        { id: 'consulting-firm',  label: 'Consulting Firm' },
        { id: 'ecommerce',        label: 'E-Commerce' },
      ];

      var stored    = window.templateData || {};
      var pdfData   = {};        // newly read base64 data URLs
      var dirHandle = null;      // FileSystemDirectoryHandle for the project root
      var DB_NAME   = 'wf-admin', STORE = 'handles', KEY = 'projectDir';

      // ── IndexedDB helpers ─────────────────────────────────────────────────

      function openDB() {
        return new Promise(function (resolve, reject) {
          var req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = function () { req.result.createObjectStore(STORE); };
          req.onsuccess = function () { resolve(req.result); };
          req.onerror   = function () { reject(req.error); };
        });
      }

      async function loadStoredHandle() {
        try {
          var db   = await openDB();
          var tx   = db.transaction(STORE, 'readonly');
          var req  = tx.objectStore(STORE).get(KEY);
          return await new Promise(function (res) { req.onsuccess = function () { res(req.result || null); }; req.onerror = function () { res(null); }; });
        } catch (e) { return null; }
      }

      async function storeHandle(handle) {
        try {
          var db  = await openDB();
          var tx  = db.transaction(STORE, 'readwrite');
          tx.objectStore(STORE).put(handle, KEY);
        } catch (e) { /* silent */ }
      }

      // ── Folder connection ─────────────────────────────────────────────────

      async function connectFolder() {
        if (!window.showDirectoryPicker) {
          document.getElementById('connect-status').textContent = 'Browser not supported — use the clipboard fallback below.';
          document.getElementById('connect-status').className = 'save-status err';
          document.getElementById('fallback-bar').style.display = '';
          return;
        }
        try {
          var handle = await window.showDirectoryPicker({ mode: 'readwrite' });
          await storeHandle(handle);
          dirHandle = handle;
          markConnected();
        } catch (e) {
          if (e.name !== 'AbortError') {
            document.getElementById('connect-status').textContent = 'Could not connect: ' + e.message;
            document.getElementById('connect-status').className = 'save-status err';
          }
        }
      }

      function markConnected() {
        var card   = document.getElementById('connect-card');
        var cs     = document.getElementById('connect-status');
        cs.textContent = '✓ Connected — PDFs will save automatically.';
        cs.className   = 'save-status ok';
        card.querySelector('button').textContent = 'Reconnect folder';
      }

      // ── Auto-save ─────────────────────────────────────────────────────────

      async function autoSave(triggeredById) {
        var st = document.getElementById('status');
        // ensure read/write permission is still granted
        try {
          var perm = await dirHandle.requestPermission({ mode: 'readwrite' });
          if (perm !== 'granted') throw new Error('Permission denied');
        } catch (e) {
          // fall back to clipboard
          document.getElementById('fallback-bar').style.display = '';
          copyToClipboard();
          return;
        }

        try {
          // navigate to data/ subfolder
          var dataDir  = await dirHandle.getDirectoryHandle('data', { create: false });
          var fileHand = await dataDir.getFileHandle('template-data.js', { create: true });
          var writable = await fileHand.createWritable();
          await writable.write(buildJS());
          await writable.close();

          var s = document.getElementById('status-' + triggeredById);
          s.textContent = '✓ Saved — reload the template page to see it.';
          s.className   = 'row-status loaded';
        } catch (e) {
          document.getElementById('fallback-bar').style.display = '';
          st.textContent = 'Auto-save failed: ' + e.message + ' — use Copy to clipboard.';
          st.className   = 'save-status err';
        }
      }

      // ── Build output JS ───────────────────────────────────────────────────

      function buildJS() {
        var lines = TEMPLATES.map(function (t) {
          var val = pdfData[t.id] || (stored[t.id] && stored[t.id].pdfPath) || '';
          var pad = ' '.repeat(Math.max(1, 18 - t.id.length));
          return "  '" + t.id + "'" + pad + ": { label: '" + t.label + "', pdfPath: " + JSON.stringify(val) + " }";
        });
        return (
          '// Template PDF data — managed via admin/templates.html\n' +
          'window.templateData = {\n' +
          lines.join(',\n') + ',\n' +
          '};\n'
        );
      }

      function copyToClipboard() {
        var st = document.getElementById('status');
        navigator.clipboard.writeText(buildJS()).then(function () {
          st.textContent = 'Copied! Open data/template-data.js in VS Code, press Ctrl+A, then paste.';
          st.className = 'save-status ok';
          setTimeout(function () { st.textContent = ''; }, 7000);
        }).catch(function () {
          st.textContent = 'Clipboard blocked — check browser permissions.';
          st.className = 'save-status err';
        });
      }

      // ── Build rows ────────────────────────────────────────────────────────

      var rowsEl = document.getElementById('template-rows');

      TEMPLATES.forEach(function (t) {
        var existing   = (stored[t.id] && stored[t.id].pdfPath) || '';
        var hasExisting = existing.length > 0;

        var row = document.createElement('div');
        row.className = 'template-row';

        var lbl = document.createElement('span');
        lbl.className = 'row-label';
        lbl.textContent = t.label;

        var browseLabel = document.createElement('label');
        browseLabel.className = 'browse-label';
        browseLabel.textContent = 'Choose PDF';
        var fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = '.pdf';
        fileInput.style.display = 'none';

        var statusEl = document.createElement('span');
        statusEl.className = 'row-status' + (hasExisting ? ' loaded' : '');
        statusEl.id = 'status-' + t.id;
        statusEl.textContent = hasExisting ? '✓ PDF loaded' : 'No PDF yet';

        fileInput.onchange = (function (id) {
          return function () {
            var file = this.files[0];
            if (!file) return;
            var s = document.getElementById('status-' + id);
            s.className = 'row-status';
            s.textContent = 'Reading…';
            var reader = new FileReader();
            reader.onload = function (e) {
              pdfData[id] = e.target.result;
              if (dirHandle) {
                s.textContent = 'Saving…';
                autoSave(id);
              } else {
                s.className = 'row-status loaded';
                s.textContent = '✓ ' + file.name + ' ready — connect folder to auto-save, or use clipboard.';
                document.getElementById('fallback-bar').style.display = '';
              }
            };
            reader.onerror = function () {
              s.textContent = 'Error reading file — try again';
            };
            reader.readAsDataURL(file);
          };
        })(t.id);

        browseLabel.appendChild(fileInput);
        row.appendChild(lbl);
        row.appendChild(browseLabel);
        row.appendChild(statusEl);
        rowsEl.appendChild(row);
      });

      // ── On load: restore stored handle ───────────────────────────────────

      (async function () {
        var h = await loadStoredHandle();
        if (!h) return;
        try {
          // silently re-request permission (may succeed without a dialog if still granted)
          var perm = await h.queryPermission({ mode: 'readwrite' });
          if (perm === 'granted') { dirHandle = h; markConnected(); }
          else {
            // needs a user gesture — show a "Re-grant" prompt instead
            var cs = document.getElementById('connect-status');
            cs.textContent = 'Click "Reconnect folder" to restore auto-save.';
            cs.className = 'save-status';
            document.getElementById('connect-card').querySelector('button').textContent = 'Reconnect folder';
          }
        } catch (e) { /* stale handle — ignore */ }
      })();
    </script>
  </body>
</html>
