<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | IVÓRI Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="admin.css" />
    <style>
      .hub-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 36px;
      }
      .hub-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 32px 28px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        text-decoration: none;
        color: inherit;
        transition: border-color 0.18s, box-shadow 0.18s;
      }
      .hub-card:hover {
        border-color: var(--primary);
        box-shadow: var(--shadow);
      }
      .hub-card-tag {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--primary);
      }
      .hub-card h2 { margin: 0; font-size: 1.15rem; }
      .hub-card p  { margin: 0; font-size: 0.875rem; color: var(--text-muted); }
      @media (max-width: 480px) { .hub-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="../index.html" class="logo" aria-label="IVÓRI Studio home">
          <span class="logo-mark">W</span>
          <span>IVÓRI</span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="../index.html">Home</a>
          <a href="../templates/index.html">Templates</a>
          <a href="../customer-sites.html">Client work</a>
          <span class="nav-current">Admin</span>
        </nav>
      </div>
    </header>

    <main>
      <div class="admin-wrap">
        <p class="section-tag">Internal</p>
        <h1 style="margin-bottom: 8px;">Admin Panel</h1>
        <p style="color: var(--text-muted);">Local use only — not linked from the public website.</p>

        <div class="hub-grid">
          <a href="templates.html" class="hub-card">
            <span class="hub-card-tag">Templates</span>
            <h2>Template PDFs</h2>
            <p>Assign a PDF preview to each of the 9 template pages.</p>
          </a>
          <a href="clients.html" class="hub-card">
            <span class="hub-card-tag">Portfolio</span>
            <h2>Client Work</h2>
            <p>Add, edit, and remove client portfolio entries.</p>
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
