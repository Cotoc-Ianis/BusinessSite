<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | WebForge Studio</title>
    <meta
      name="description"
      content="Complete your selected website package purchase with WebForge Studio."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        background: linear-gradient(180deg, #f4f7fb 0%, #edf5f8 100%);
      }

      .payment-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
      }

      .payment-card {
        width: min(760px, 100%);
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 36px 32px;
        box-shadow: var(--shadow);
      }

      .payment-card h1 {
        margin: 0 0 10px;
        color: var(--navy);
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: -0.05em;
      }

      .payment-card p {
        margin: 0 0 24px;
        color: var(--muted);
      }

      .summary-box {
        background: linear-gradient(180deg, rgba(36, 151, 168, 0.08), rgba(255, 255, 255, 0.98));
        border: 1px solid rgba(36, 151, 168, 0.15);
        border-radius: 20px;
        padding: 22px 20px;
        margin-bottom: 28px;
      }

      .summary-box strong {
        color: var(--navy);
        font-size: 1.2rem;
      }

      .pay-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 0 24px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--gold), #f0bf5d);
        color: var(--navy);
        font-weight: 800;
        cursor: pointer;
        text-decoration: none;
      }

      .checkout-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        border-top: 1px solid var(--border);
        padding-top: 22px;
      }

      .small-note {
        font-size: 0.9rem;
        color: var(--muted);
      }

      @media (max-width: 700px) {
        .checkout-row {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="index.html" class="logo" aria-label="WebForge Studio home">
          <span class="logo-mark">W</span>
          <span>WebForge</span>
        </a>

        <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="index.html#about">About</a>
          <a href="index.html#packages">Packages</a>
          <a href="customer-sites.html">Client work</a>
          <a href="payment.html?package=starter" class="active-page">Checkout</a>
          <a href="index.html#contact">Contact</a>
        </nav>
      </div>
    </header>

    <main class="payment-page">
      <section class="payment-card" aria-label="Package checkout">
        <p class="section-tag">Checkout</p>
        <h1>Complete your package.</h1>
        <p>Select your package and continue to secure payment.</p>

        <div class="summary-box">
          <div class="package-header">
            <span class="package-name">Selected package</span>
            <strong id="package-name">Starter</strong>
          </div>
          <div class="package-header" style="margin-top: 12px; margin-bottom: 0;">
            <span class="package-name">Total</span>
            <strong id="package-price">$799</strong>
          </div>
        </div>

        <div class="checkout-row">
          <a class="btn btn-ghost" href="index.html">Back to home</a>
          <a class="pay-button" href="#" aria-label="Pay for selected package">Pay now</a>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
    <script>
      const packageData = {
        starter: { name: 'Starter', price: '$799' },
        growth: { name: 'Growth', price: '$1,499' },
        premium: { name: 'Premium', price: '$2,499' }
      };

      const params = new URLSearchParams(window.location.search);
      const selectedPackage = params.get('package') || 'starter';
      const item = packageData[selectedPackage] || packageData.starter;

      document.getElementById('package-name').textContent = item.name;
      document.getElementById('package-price').textContent = item.price;
    </script>
  </body>
</html>
